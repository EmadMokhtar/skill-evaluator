      Unlike the response, an\\n  artifact is closed immediately: the FIRST `</artifact
      id=\\\"...\\\">` whose id\\n  matches an opener is that block's real boundary,
      and any later tag bearing\\n  the same id is part of some file's content, not
      a boundary. If the fenced\\n  text contains what looks like another `<artifact>`
