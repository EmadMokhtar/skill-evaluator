site_name: skill-lens
site_description: Run evaluations on Agent Skills (SKILL.md) — in CI/CD or on demand.
site_url: https://emadmokhtar.github.io/skill-evaluator/
repo_url: https://github.com/EmadMokhtar/skill-evaluator
repo_name: EmadMokhtar/skill-evaluator
edit_uri: edit/main/docs/

validation:
  anchors: warn
  absolute_links: warn

# docs/superpowers/ is a historical record of design specs and plans. It lives
# in the repo but is not part of the published site.
exclude_docs: |
  superpowers/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  # No toc_depth: Python-Markdown reads it from the extension config only, so
  # any value here applies to every page. Setting it to 2 to shorten
  # invariants.md's sidebar also drops the level-3 entries from
  # troubleshooting.md, releasing.md, runners.md and four others, where those
  # subsections are what a reader scans for. invariants.md listing all of its
  # claims is the right outcome anyway -- it is a page to look things up in.
  - toc:
      permalink: true
  # The custom fence renders ```mermaid blocks as diagrams. The
  # `!!python/name:` tag is what MkDocs needs and what a plain SafeLoader
  # refuses; tests/test_docs.py parses this file with a tag-tolerant loader.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # base_path reaches the repo root so docs/architecture.md can include the
  # root-level ARCHITECTURE.md instead of duplicating it.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Guides:
      - Getting started: getting-started.md
      - Concepts: concepts.md
      - Writing evals: writing-evals.md
      - CI integration: ci.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Eval files: eval-files.md
      - CLI: cli.md
      - Configuration: configuration.md
      - Runners: runners.md
      - Gating and exit codes: gating.md
      - Comparative evals: comparative-evals.md
  - Internals:
      - Architecture: architecture.md
      - Invariants: invariants.md
      - Security: security.md
      - Releasing: releasing.md
      - Contributing: contributing.md
  - Roadmap: roadmap.md
