site_name: skill-lens
site_description: Run evaluations on Agent Skills (SKILL.md) — in CI/CD or on demand.
site_url: https://emadmokhtar.github.io/skill-evaluator/
repo_url: https://github.com/EmadMokhtar/skill-evaluator
repo_name: EmadMokhtar/skill-evaluator
edit_uri: edit/main/docs/

validation:
  anchors: warn
  absolute_links: warn

# docs/superpowers/ is a historical record of design specs and plans. It lives
# in the repo but is not part of the published site.
exclude_docs: |
  superpowers/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  # toc_depth keeps the invariant headings on invariants.md out of the
  # sidebar, which would otherwise list every one of them instead of the nine
  # groups. Python-Markdown still gives each heading an `id` and a permalink,
  # so a link to #the-delta-is-paired resolves.
  - toc:
      permalink: true
      toc_depth: 2
  # The custom fence renders ```mermaid blocks as diagrams. The
  # `!!python/name:` tag is what MkDocs needs and what a plain SafeLoader
  # refuses; tests/test_docs.py parses this file with a tag-tolerant loader.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # base_path reaches the repo root so docs/architecture.md can include the
  # root-level ARCHITECTURE.md instead of duplicating it.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Reference:
      - Eval files: eval-files.md
      - Writing evals: writing-evals.md
      - CLI: cli.md
      - Configuration: configuration.md
      - Runners: runners.md
      - Gating and exit codes: gating.md
      - Comparative evals: comparative-evals.md
      - CI integration: ci.md
      - Releasing: releasing.md
  - Roadmap: roadmap.md
  - Architecture: architecture.md
  - Invariants: invariants.md
  - Security: security.md
  - Contributing: contributing.md
