# skill-lens.toml — an annotated example of a committed configuration.
#
# This is the file a repository commits once it evaluates against a real
# agent in CI. Every key skill-lens knows is listed; the ones this example
# sets are live, the rest are commented out at their defaults.
#
# Resolution order: CLI flag > this file > built-in default. Secrets never
# live here: API keys come from environment variables only.
#
# Use it from the repository root with
#   skill-lens run ./examples --config examples/skill-lens.toml
# It is not picked up on its own from there: discovery searches upward from
# the current directory, and this file sits below it on purpose, so a plain
# `skill-lens run` from the repository root keeps the offline defaults and
# never reaches for a real agent — or an API key — by accident.

# "fake" is the offline, scripted runner; "pydantic-ai" and "langchain" run a
# real agent through a framework; "copilot", "claude-code" and "cli" start an
# installed agent product (see [runners.*] below). A list runs every case
# through each name.
default_runner = "pydantic-ai"

# Model id for the runner. Needs the provider's key in the environment
# (OPENAI_API_KEY here).
model = "openai:gpt-4o-mini"

# Endpoint for a self-hosted, OpenAI-compatible server (Ollama, vLLM, a
# gateway). Empty means the provider's own variable (OPENAI_BASE_URL,
# OLLAMA_BASE_URL), then its default. Not a secret, so it belongs here; a
# URL carrying user:password@ is refused. --base-url overrides it.
# base_url = "http://localhost:11434/v1"

# Sampling temperature, or the string "unset" for reasoning models that
# reject an explicit one.
# temperature = 0.0

# Retries on a provider failure, and the wait between them in seconds.
# retries = 2
# retry_backoff_seconds = 1.0

# "fake" never grades — a rubric case errors rather than passing unchecked.
# "pydantic-ai" and "langchain" grade every `judge:` block with a real model.
# "copilot" / "claude-code" / "cli" grade through the product named in
# [runners.<name>] — no API key; the two keys below are then not read.
judge = "pydantic-ai"

# Model for the judge; empty means "the same model as `model`".
# judge_model = ""
# Endpoint for the judge. Empty inherits `base_url` exactly when
# `judge_model` is empty; a judge with its own model gets its provider's
# default unless this names one.
# judge_base_url = ""
# judge_temperature = 0.0

# The gate. 1.0 means every case must pass.
min_pass_rate = 1.0

# Whether an errored case (the runner or an evaluator broke) fails the gate.
# fail_on_error = true

# Comparative runs: "" (off), "none" (an empty skill) or "previous" (the
# prior version from git). `repeat` samples each arm N times. `min_delta`
# has no default — unset means the delta is reported but not gated; 0.0
# below is an example value meaning "must not regress".
# baseline = ""
# repeat = 1
# min_delta = 0.0

# Cases run at once. The work is network-bound, so the ceiling is your
# provider's rate limit, not your CPU.
concurrency = 4

# A ceiling on what one run spends, in US dollars: once the run has recorded
# this much (runs and judge, both arms), no new case starts, the rest are
# reported as not run and the gate fails. A run whose runner or judge can
# never price its spend (copilot, cli, an unpriced model) is refused, so
# leave it unset there.
# max_spend_usd = 5.00

# Keep each case's temporary directory for inspection. Every kept directory
# is printed, so this is safe to commit.
# keep_workspace = false

# Print a failing case's whole output instead of the first 500 characters.
# full_output = false

# Runaway guards on what one case's workspace may write.
# max_file_bytes = 1000000
# max_files = 200
# max_total_bytes = 5000000

# Run the scripts a skill bundles under scripts/. Off by default: a SKILL.md
# under evaluation is unvetted code, and skill-lens runs in CI. On here so
# that examples/log-triage can run its counting script.
allow_scripts = true

# "auto": use sandbox-exec (macOS) or bwrap (Linux) when the probe succeeds,
# otherwise the portable guards alone; "required" refuses to run without one;
# "off" never probes. The report says which applied on every run.
# script_sandbox = "auto"

# Wall clock per script call; the whole process tree is killed at expiry.
# script_timeout_seconds = 30.0

# Per stream; anything beyond is cut with a visible marker.
# max_script_output_bytes = 20000

# Interpreter per file extension, looked up on PATH. Anything else is refused.
# [script_interpreters]
# py = ["python3"]
# sh = ["bash"]

# How a product runner or product judge is isolated, decided once per run.
# "auto": a temporary home and an allowlisted environment, inside
# sandbox-exec (macOS) or bwrap (Linux) where one works; "required": exit 2
# when none works; "off": your whole environment and real home. Home
# isolation alone is not a sandbox. Overridden by --product-sandbox.
# product_sandbox = "auto"

# Product runners: start the product the skill ships to, no API key needed.
# The same table serves the product as the judge (`judge = "<name>"` above).
# Each table is optional for a preset; the preset supplies the verified argv.
# "command" replaces that argv (exactly one element must be "{prompt}"),
# "args" is appended to it. No token belongs here: the product reads its own.
# [runners.copilot]
# args = ["--model", "gpt-5.2"]     # appended to the preset's argv
# timeout_seconds = 600.0
# max_output_bytes = 8000000
#
# [runners.claude-code]
# args = ["--model", "sonnet"]
# Names only, never values. Under the default product_sandbox a preset needs
# its own token, or a credential named here (TOKEN/KEY/SECRET/PASSWORD/CREDENTIAL).
# pass_env = ["CLAUDE_CODE_USE_BEDROCK", "AWS_REGION", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"]
#
# "cli" has no preset, so "command" is required. "skills_dir" and "invoke"
# are accepted here only; a preset's spellings are fixed.
# [runners.cli]
# command = ["my-agent", "--prompt", "{prompt}"]   # exactly one "{prompt}" element
# skills_dir = ".agents/skills"
# invoke = "{task}"

# A stricter floor for one skill, by name. Must stay the last section: in
# TOML every key after a [table] header belongs to that table.
[per_skill_min]
order-support = 1.0
