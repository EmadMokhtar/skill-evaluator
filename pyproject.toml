[project]
name = "skill-lens"
version = "0.12.0"
description = "Run evaluations on Agent Skills (SKILL.md) in CI/CD or manually"
readme = "README.md"
requires-python = ">=3.11.4"
license = { file = "LICENSE" }
keywords = [
    "agent-skills",
    "skill",
    "evals",
    "evaluation",
    "llm",
    "ci",
    "testing",
]
classifiers = [
    # 0.x: the CLI and the eval file format may still change in a minor release.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    # Core, not an optional extra. An optional extra would make
    # `kind: json-schema` fail at *evaluate* time, and this project draws a
    # hard line between authoring errors (abort, exit 2) and infra errors
    # (errored); a missing library for a declared assertion is cleanly
    # neither. It is small and pure Python.
    "jsonschema>=4.21",
]

# The distribution is `skill-lens` but the repository is `skill-evaluator`, so a
# reader who lands on the PyPI page has no way to guess where the source lives.
# These links are the only thing connecting the two names.
[project.urls]
Homepage = "https://emadmokhtar.github.io/skill-evaluator/"
Documentation = "https://emadmokhtar.github.io/skill-evaluator/"
Source = "https://github.com/EmadMokhtar/skill-evaluator"
Issues = "https://github.com/EmadMokhtar/skill-evaluator/issues"

[project.scripts]
skill-lens = "skill_lens.cli:app"

[project.optional-dependencies]
# Anthropic is in both so a matrix run can name one --model every runner accepts.
pydantic-ai = ["pydantic-ai-slim[openai,anthropic]>=2.22"]
langchain = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    # `runners/pricing.py` imports it; without this line it only arrives as a
    # transitive dependency of pydantic-ai, and a [langchain]-only install
    # would stamp every case with "genai-prices is not installed".
    "genai-prices>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "commitizen>=3.29",
    "pre-commit>=4.6.1",
    "pytest-recording>=0.13",
    "vcrpy>=8.0",
    # Both frameworks, so `uv sync && uv run pytest` collects every adapter
    # test without an extra. Test-only; installers choose an extra instead.
    "pydantic-ai-slim[openai]>=2.22",
    "langchain>=1.0",
    "langchain-openai>=1.0",
]
docs = [
    # Capped below 2.0: MkDocs 2.0 removes the plugin system entirely, with no
    # migration path, which would break mkdocs-material and the docs build outright.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
# Mirrors [build-system] requires, and must stay equal to it
# (tests/test_security_checks.py). uv.lock records what the project installs,
# not what builds it: the backend is resolved fresh at build time and would
# never be audited. Listing it here puts it in the lockfile, so `uv audit`
# covers it, and lets the release build pin it (`uv export --only-group
# build` -> `uv build --build-constraint`) to the exact audited version.
build = ["hatchling>=1.27,<2"]

[build-system]
# Bounded rather than floating: the release runner builds with whatever it
# resolves on the day, and an unpinned major could change the artifact the
# release publishes without a single commit in this repository.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_lens"]

# Exceptions to `uv audit` live here and only here. Every invocation -- the
# Security workflow, the release gate, the pre-push hook -- reads this table,
# so an exception can never be in one place and not another. Only
# `ignore-until-fixed` is allowed: it stops hiding an advisory the day a fixed
# version exists, so the check turns red again and forces the upgrade. Plain
# `ignore` hides a finding forever and is rejected by tests/test_security_checks.py.
# Each entry carries a comment saying why the finding does not apply.
#
# uv does not validate this table, so a misspelled key would be silently
# ignored and the finding silently kept; the same test rejects any other key.
#
# [tool.uv.audit]
# ignore-until-fixed = [
#     "GHSA-xxxx-xxxx-xxxx",  # <package>: <why this does not affect skill-lens>
# ]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real provider APIs; requires an API key (deselected by default)",
    "cassette: replays recorded provider traffic; no network, no key needed",
]
addopts = "-m 'not integration' --block-network"
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pydantic_graph._utils",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
# S is flake8-bandit: the static security check on our own code (shell=True,
# unsafe YAML loaders, hard-coded credentials, ...). It rides on the existing
# `ruff check`, so it runs everywhere lint does with no extra step.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), run git in subprocesses the way the code under test
# does (S603, S607), parse the JUnit XML they just wrote (S314), and use
# literal "/tmp/..." strings as fake path values in model fixtures (S108) --
# real temporary directories come from pytest's tmp_path.
"tests/**" = ["S101", "S603", "S607", "S314", "S108"]
# The CI helper scripts run git with a fixed argv and no shell (S603, S607).
"scripts/**" = ["S603", "S607"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
# Commitizen creates a lightweight tag unless told otherwise, and
# `git push --follow-tags` (release.yml) pushes only annotated tags — without
# this, every release commit would reach main while its tag stayed on the
# ephemeral runner and vanished when the job ended.
annotated_tag = true
update_changelog_on_bump = true
# Keep breaking changes inside 0.x. M6 and M7 still expect to change the eval
# file format, so a "!" commit must not declare the CLI surface stable.
major_version_zero = true
# Files that spell the version. cz bump rewrites them inside the bump commit
# itself, so the tree at tag vX.Y.Z already installs and documents X.Y.Z.
#
# Each entry gates per line on its regex, and a file where nothing matched is
# rewritten unchanged with no error -- so reformatting a pinned line would
# silently ship a stale pin. The guard against that is `--check-consistency`,
# which release.yml passes to `cz bump`; it turns "matched nothing" into a
# hard failure before the version is written, before `git add`, and before the
# tag. It is a CLI flag only: Commitizen 4.17 reads it from the command line
# (commands/bump.py: `arguments["check_consistency"]`), never from this file,
# so writing `check_consistency = true` here would be an inert no-op. The
# workflow test asserts the flag is on the command.
version_files = [
    "action.yml:skill-lens\\[pydantic-ai\\]==",
    "docs/ci.md:skill-evaluator@v",
    "docs/ci.md:skill-lens\\[pydantic-ai\\]==",
    "docs/ci.md:skill-lens\\[pydantic-ai,langchain\\]==",
    "docs/getting-started.md:skill-evaluator@v",
    "README.md:skill-evaluator@v",
    "examples/ci/skill-lens.yml:skill-evaluator@v",
]
bump_message = "bump: version $current_version → $new_version [skip ci]"
