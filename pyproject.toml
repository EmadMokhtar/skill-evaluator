[project]
name = "skill-eval"
version = "0.1.0"
description = "Run evaluations on Agent Skills (SKILL.md) in CI/CD or manually"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
skill-eval = "skill_eval.cli:app"

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim[openai]>=2.22"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "commitizen>=3.29",
    "pre-commit>=4.6.1",
    "pytest-recording>=0.13",
    "vcrpy>=8.0",
    "pydantic-ai-slim[openai]>=2.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real provider APIs; requires an API key (deselected by default)",
    "cassette: replays recorded provider traffic; no network, no key needed",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pydantic_graph._utils",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
