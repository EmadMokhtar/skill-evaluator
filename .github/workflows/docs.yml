name: Docs

# Requires a one-time manual setting: Settings -> Pages -> Source = "GitHub Actions".
# Until that is set, `deploy` fails with an opaque error even though `build` succeeds,
# and every https://emadmokhtar.github.io/skill-evaluator/... link in README.md stays dead.

on:
  push:
    branches: [main]
  # Allows a redeploy without a code change.
  workflow_dispatch:

# Nothing at the workflow level; each job asks for exactly what it uses, so
# `build` -- which runs third-party tooling on the checkout -- never holds the
# token that can publish to Pages.
permissions: {}

# One deploy at a time, and never cancel one mid-flight -- a cancelled deploy can
# leave Pages serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `actions/configure-pages` calls GET /repos/{owner}/{repo}/pages and
      # fails the job when the call is refused; read is all it needs.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build the site
        run: uv run mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1