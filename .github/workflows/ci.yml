name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` are not default trigger types, but the docs-freshness
    # job's `no-docs-needed` escape hatch is worthless without them: without a
    # rerun, adding the label leaves the already-failed check red.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  conventional-commits:
    # A squash-merge turns the PR title into the commit on main, so the title is
    # what release automation (cz bump) actually parses. Both it and the branch's
    # own commits are checked.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check PR title
        env:
          # Passed via env, never interpolated into the script body, so a crafted
          # PR title cannot inject shell commands.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"
          printf '%s' "$PR_TITLE" | uv run cz check --commit-msg-file /dev/stdin

      - name: Check branch commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run python scripts/check_commits.py "$BASE_SHA" HEAD

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -v

      - name: Self-check (dogfood the CLI on examples/ and skills/)
        # The examples and the shipped skill's suite assert real model
        # behaviour and include judged cases, so they cannot be run with
        # FakeRunner. `list` still exercises discovery, YAML parsing and
        # tool/trajectory/budget schema validation on real files at zero cost;
        # the full run path is covered every PR by the cassette tier.
        run: |
          uv run skill-eval list ./examples
          uv run skill-eval list ./skills

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build the docs site
        # --strict turns a dead reference or an unresolvable snippet into a
        # failure rather than a warning nobody reads.
        run: uv run mkdocs build --strict

  docs-freshness:
    # Blunt backstop for stale prose, which tests/test_docs.py cannot see. The
    # `no-docs-needed` label is the escape hatch for refactors and internal-only
    # changes; a label is used rather than a commit trailer because PRs are
    # squash-merged, which rewrites the message.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git diff base...head` needs both sides of the history.
          fetch-depth: 0

      - name: Check that documentation was updated
        env:
          # Passed via env rather than interpolated into the script body, matching
          # the conventional-commits job.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # No dependencies: the script is stdlib-only, so this needs no uv sync.
        run: python3 scripts/check_docs_updated.py "$BASE_SHA" HEAD

  action-smoke:
    # Exercises action.yml end to end. tests/test_action.py can only check that
    # the inputs match the CLI's flags; nothing but a real run catches a missing
    # `shell: bash`, a bad expression, or a step that swallows the exit code.
    # `install-spec: .` installs this checkout, so the job needs no release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the action against a fixture skill
        uses: ./
        with:
          path: tests/fixtures/ci-smoke
          runner: fake
          install-spec: .
          json-output: smoke/report.json
          junit-output: smoke/junit.xml
          markdown-output: smoke/summary.md

      - name: Assert the reports were written and are well-formed
        run: |
          set -euo pipefail
          test -f smoke/report.json
          test -f smoke/junit.xml
          test -f smoke/summary.md
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('smoke/junit.xml')"
          grep -q "gate passed" smoke/summary.md
