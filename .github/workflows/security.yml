name: Security

# The dependency audit. The same command also runs inside release.yml's
# `verify` job, so a vulnerable lockfile can never be published, and in the
# pre-push hook, so it is seen before a branch leaves a laptop. This workflow
# is the copy that runs on a timer: an advisory can be published against a
# uv.lock nobody has touched, and only a schedule notices that.
#
# The timer carries a second check, `published`: every release tag on origin
# against PyPI, so a tagged version that was never published is found even on
# a week when nothing merges.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  # Re-check by hand after a fix lands, or when an advisory is in the news,
  # without inventing a commit to trigger it.
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        # No cache: the audit installs nothing, it only reads uv.lock.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Audit the lockfile for known vulnerabilities
        # `uv audit` reads uv.lock and asks OSV (osv.dev) about every package
        # in it; nothing is installed. `--locked` fails if pyproject.toml and
        # uv.lock disagree, so the audit covers what people actually install
        # rather than a fresh resolution nobody has seen. `--preview-features
        # audit` acknowledges that the command is still a uv preview feature;
        # without it every log opens with an "experimental" warning.
        #
        # Exceptions never go on this line. They live in `[tool.uv.audit]` in
        # pyproject.toml, which every copy of this command reads, and only as
        # `ignore-until-fixed` -- see the comment there for the policy.
        # tests/test_security_checks.py requires this line to be identical to
        # the one in release.yml and in .pre-commit-config.yaml.
        run: uv audit --preview-features audit --locked

  published:
    # A version can be tagged and never published: release.yml's `publish`
    # waits for a reviewer inside the `pypi` environment, and if that approval
    # never comes the run ends with the tag on main and nothing on PyPI. The
    # release workflow checks for that whenever a merge releases nothing, but
    # a stranded tag with no merge after it would wait for the next merge to
    # be noticed (issue #103, v0.21.0). The schedule is what finds it then.
    #
    # Only on the schedule and on demand. A stranded tag says nothing about
    # the pull request under review, and a push to main already runs the
    # release workflow's own copy. The command is spelled identically there
    # (tests/test_security_checks.py). Re-run it by hand after re-running the
    # stranded release's failed jobs to see it go green.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Naming the run that should have published a stranded tag lists
      # workflow runs with this job's token, and a token without `actions:
      # read` is refused on that endpoint.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check every release tag reached PyPI
        # Standard library only, so nothing is installed here either. The
        # tags come from `git ls-remote origin`, not the shallow checkout.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_tags_published.py
